<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장부</title>
  
  <link rel="icon" href="https://i.ibb.co/JwZ0B8C4/favicon.jpg" type="image/jpeg">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

    body { margin: 0; background: #1C2A1E; }
    
    .ml-root {
      --bg: #1C2A1E;
      --paper: #EFE6D2;
      --paper-soft: #E6DCC4;
      --ink: #2A2016;
      --ink-soft: #6B5E48;
      --line: #C9BC9C;
      --income: #3F6B45;
      --expense: #A83F27;
      --gold: #C79A2E;

      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 20px 14px 110px;
      box-sizing: border-box;
    }
    .ml-root * { box-sizing: border-box; }

    .ml-content-area {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }

    .ml-sidebar-calc-container {
      position: fixed;
      bottom: 16px;
      right: 14px;
      width: 290px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ml-sidebar-calc {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .ml-calc-toggle-btn {
      background: #3A4A3B; color: var(--paper); border: 1px solid #4A5A4B;
      padding: 8px 12px; font-size: 12px; font-weight: 600; border-radius: 20px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; width: 100%;
    }
    .ml-calc-toggle-btn:hover { background: #4A5A4B; border-color: var(--gold); }

    @media (max-width: 768px) {
      .ml-sidebar-calc-container {
        right: 10px;
        width: 260px;
      }
      .ml-sidebar-calc {
        padding: 12px;
      }
    }

    .ml-floating-goal-container {
      position: fixed;
      bottom: 16px;
      left: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ml-goal-toggle-btn {
      background: #3A4A3B; color: var(--paper); border: 1px solid #4A5A4B;
      padding: 10px 14px; font-size: 13px; font-weight: 600; border-radius: 20px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 6px; width: fit-content;
    }
    .ml-goal-toggle-btn:hover { background: #4A5A4B; border-color: var(--gold); }

    .ml-goal-floating-box {
      width: 250px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .ml-mini-goal-widget {
      width: 250px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ml-mini-goal-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .ml-mini-goal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--ink);
    }
    .ml-mini-bar-bg {
      width: 100%;
      height: 5px;
      background: #E6DCC4;
      border-radius: 3px;
      overflow: hidden;
    }
    .ml-mini-bar-fill {
      height: 100%;
      background: var(--income);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .ml-header { margin: 0 auto 16px; }
    .ml-header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .ml-header-title { display: flex; align-items: flex-start; gap: 10px; color: var(--paper); }
    .ml-header-title h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 26px;
      margin: 0;
      letter-spacing: 0.2px;
    }
    .ml-header-title span.icon { font-size: 24px; margin-top: 2px; }

    .ml-mvp-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2A3A2C;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #3A4A3B;
    }
    .ml-mvp-box label {
      font-size: 12px;
      color: var(--paper);
      font-weight: 600;
    }
    .ml-mvp-box select {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #FBF7EC;
      color: var(--ink);
      font-weight: 600;
    }

    .ml-tabs {
      margin: 0 auto 18px;
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #3A4A3B;
      overflow-x: auto;
    }
    .ml-tab {
      background: none;
      border: none;
      color: #9FAE9A;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .ml-tab.active { color: var(--paper); border-bottom-color: var(--gold); }

    .ml-page { display: flex; flex-direction: column; gap: 14px; }

    .ml-panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 18px 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.15);
    }
    .ml-panel-compact {
      padding: 12px 14px;
    }
    .ml-panel h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; margin: 0 0 12px; color: var(--ink); }
    .ml-panel-compact h2 { font-size: 15px; margin: 0 0 8px; }

    .ml-empty { font-size: 13px; color: var(--ink-soft); margin: 0; padding: 10px 0; }

    .ml-range-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .ml-range-reset {
      font-size: 11px; font-weight: 600; color: var(--ink-soft); background: none;
      border: 1px solid var(--line); border-radius: 12px; padding: 2px 8px; cursor: pointer;
    }
    .ml-range-reset:hover { border-color: var(--gold); color: var(--ink); }
    .ml-range-row { display: flex; align-items: center; gap: 8px; }
    .ml-range-row input {
      flex: 1; font-family: 'Inter', sans-serif; font-size: 13px; padding: 6px 10px;
      border: 1px solid var(--line); border-radius: 3px; background: #FBF7EC; color: var(--ink);
    }

    .ml-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ml-stat-card {
      background: var(--paper); border: 1px solid var(--line);
      border-left: 3px solid var(--ink-soft); border-radius: 3px; padding: 12px;
    }
    .ml-stat-card.income { border-left-color: var(--income); }
    .ml-stat-card.expense { border-left-color: var(--expense); }
    .ml-stat-icon { font-size: 16px; margin-bottom: 4px; }
    .ml-stat-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
    .ml-stat-value { font-family: 'Fraunces', serif; font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
    .ml-stat-card.income .ml-stat-value { color: var(--income); }
    .ml-stat-card.expense .ml-stat-value { color: var(--expense); }
    .ml-stat-unit { font-size: 11px; font-family: 'Inter', sans-serif; font-weight: 500; margin-left: 3px; color: var(--ink-soft); }

    .ml-form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .ml-form-row label { font-size: 11px; color: var(--ink-soft); font-weight: 500; }
    .ml-form-row input, .ml-filter-row select {
      font-family: 'Inter', sans-serif; font-size: 13px; padding: 7px 9px;
      border: 1px solid var(--line); border-radius: 3px; background: #FBF7EC; color: var(--ink);
      width: 100%; min-width: 0;
    }
    .ml-form-row input:focus, .ml-filter-row select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

    .ml-korean-amount { font-size: 13px; color: var(--income); font-weight: 600; margin-top: 4px; text-align: right; line-height: 1.4; }

    .ml-seg { display: flex; gap: 6px; }
    .ml-seg button {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px; border: 1px solid var(--line); background: #FBF7EC; color: var(--ink-soft);
      border-radius: 3px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .ml-seg button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .ml-seg button.active.income { background: var(--income); border-color: var(--income); }
    
    .ml-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 12px; }
    .ml-chip { font-size: 12px; padding: 5px 10px; border-radius: 12px; border: 1px solid var(--line); background: #FBF7EC; color: var(--ink-soft); cursor: pointer; }
    .ml-chip:hover { border-color: var(--gold); color: var(--ink); }

    .ml-calc { background: #E6DCC4; border: 1px dashed var(--line); border-radius: 3px; padding: 12px; margin-bottom: 14px; }
    .ml-calc-title { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; }
    .ml-calc-row { display: flex; align-items: center; gap: 6px; width: 100%; }
    .ml-calc-row input { flex: 1; min-width: 0; font-family: 'Inter', sans-serif; font-size: 13px; padding: 8px 6px; border: 1px solid var(--line); border-radius: 3px; background: #FBF7EC; }
    .ml-calc-result { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--ink); }
    .ml-calc-apply { font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 3px; border: 1px solid var(--ink); background: transparent; cursor: pointer; white-space: nowrap; }
    .ml-calc-apply:disabled { opacity: 0.4; cursor: default; }

    .ml-calc-screen {
      background: #FBF7EC; border: 1px solid var(--line); border-radius: 3px;
      padding: 8px 10px; margin-bottom: 10px; text-align: right;
    }
    .ml-calc-expression {
      font-size: 11px; color: var(--ink-soft); min-height: 16px; overflow-x: auto; white-space: nowrap;
    }
    .ml-calc-display {
      font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600;
      color: var(--ink); overflow-x: auto; white-space: nowrap;
    }
    .ml-calc-keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .ml-calc-btn {
      padding: 9px; font-size: 13px; font-weight: 600; border: 1px solid var(--line);
      background: #FBF7EC; color: var(--ink); border-radius: 3px; cursor: pointer;
    }
    .ml-calc-btn:hover { background: #F5EFE1; border-color: var(--gold); }
    .ml-calc-btn.op { background: #DED2B4; color: var(--ink); }
    .ml-calc-btn.action { background: #2A2016; color: #EFE6D2; border-color: #2A2016; }

    .ml-filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .ml-filter-row select { flex: 1; }
    .ml-view-toggle { margin-bottom: 14px; }

    .ml-currency-root-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #DED2B4; border: 1px solid var(--line); border-radius: 4px; margin-top: 10px; cursor: pointer; user-select: none; font-weight: 700; }
    .ml-currency-root-header:hover { border-color: var(--gold); }
    .ml-currency-root-name { font-size: 15px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
    .ml-currency-root-total { font-size: 15px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
    .ml-currency-root-total.income { color: var(--income); }
    .ml-currency-root-total.expense { color: var(--expense); }

    .ml-group-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 10px 10px 20px; background: #E6DCC4; border-top: 1px solid var(--line); cursor: pointer; user-select: none; }
    .ml-group-header:hover { background: #DFD4B8; }
    .ml-group-name { font-size: 13px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; }
    .ml-group-total { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
    .ml-group-total.income { color: var(--income); }
    .ml-group-total.expense { color: var(--expense); }

    .ml-chargroup-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 8px 35px; background: #E6DCC4; border-top: 1px solid #DED2B4; cursor: pointer; user-select: none; }
    .ml-chargroup-header:hover { background: #DFD4B8; }
    .ml-chargroup-name { font-size: 12px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 6px; }
    .ml-chargroup-total { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
    .ml-chargroup-total.income { color: var(--income); }
    .ml-chargroup-total.expense { color: var(--expense); }

    .ml-tx-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid #DED2B4; }
    .ml-tx-row:first-child { border-top: none; }
    .ml-tx-row-compact { padding: 6px 0 6px 50px; border-top: none; background: #FBF7EC; border-bottom: 1px solid #E6DCC4; }
    .ml-tx-icon { font-size: 14px; flex-shrink: 0; }
    .ml-tx-main { flex: 1; min-width: 0; }
    .ml-tx-top { display: flex; justify-content: space-between; gap: 8px; }
    .ml-tx-category { font-size: 13px; font-weight: 600; }
    .ml-tx-date { font-size: 12px; color: var(--ink-soft); }
    .ml-tx-memo { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
    .ml-tx-amount { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0; }
    .ml-tx-amount.income { color: var(--income); }
    .ml-tx-amount.expense { color: var(--expense); }
    .ml-tx-unit { font-size: 11px; font-weight: 500; margin-left: 2px; }
    .ml-tx-delete { background: none; border: none; font-size: 14px; cursor: pointer; padding: 4px; }
    
    .ml-submit {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px; background: var(--ink); color: var(--paper); border: none; border-radius: 3px;
      font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px;
    }

    .ml-boss-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ml-boss-table th { background: #E6DCC4; padding: 8px; text-align: left; border-bottom: 2px solid var(--line); color: var(--ink); font-weight: 600; }
    .ml-boss-table td { padding: 8px; border-bottom: 1px solid #DED2B4; vertical-align: middle; }
    .ml-boss-diffs { display: flex; flex-wrap: wrap; gap: 6px; }
    .ml-boss-diff-label { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; cursor: pointer; background: #FBF7EC; padding: 3px 6px; border: 1px solid var(--line); border-radius: 3px; }
    .ml-boss-diff-label input { accent-color: var(--income); }
    .ml-boss-diff-label.disabled { opacity: 0.4; cursor: not-allowed; background: #E8E2D0; }
    .ml-boss-party-select { padding: 4px; font-size: 12px; border: 1px solid var(--line); border-radius: 3px; background: #FBF7EC; }
    .ml-boss-total-bar { display: flex; justify-content: space-between; align-items: center; background: #E6DCC4; padding: 12px; border-radius: 3px; margin-bottom: 12px; font-weight: 700; flex-wrap: wrap; gap: 8px; }

    .ml-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #2A2016;
      color: #EFE6D2;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 2000;
      animation: fadeInOut 1.5s ease;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }
  
    .grind-settlement-box { margin-bottom: 14px; }
    .grind-settlement-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px; background: #F3ECDD; color: var(--ink); cursor: pointer; font-size: 13px; font-weight: 700; text-align: left; }
    .grind-settlement-toggle:hover { opacity: .9; }
</style>
</head>

    function getBossPrice(cfg, diff, dateStr, currentTime = Date.now()) {
      const isBlackMage = cfg && cfg.isBlackMage;
      const changeAt = isBlackMage ? BLACK_MAGE_PRICE_CHANGE_AT : BOSS_PRICE_CHANGE_AT;

      // 변경일 당일에는 실제 한국시간 변경 시각부터 적용하고, 그 이후 날짜는 항상 변경가격 적용
      const recordDateStart = new Date(`${dateStr}T00:00:00+09:00`).getTime();
      const recordDateEnd = recordDateStart + 24 * 60 * 60 * 1000;
      const useUpdatedPrice = recordDateStart >= changeAt.getTime()
        || (recordDateStart < changeAt.getTime() && recordDateEnd > changeAt.getTime() && currentTime >= changeAt.getTime());

      if (useUpdatedPrice && BOSS_UPDATED_PRICES[cfg.name] && BOSS_UPDATED_PRICES[cfg.name][diff.key] != null) {
        return BOSS_UPDATED_PRICES[cfg.name][diff.key];
      }
      return diff.price;
    }
    
    function getThursdayToWednesdayRange(dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      const day = d.getDay(); 
      let diffToThursday = 4 - day;
      if (day < 4) {
        diffToThursday = -(3 + day);
      }
      const thursday = new Date(d);
      thursday.setDate(d.getDate() + diffToThursday);
      
      const wednesday = new Date(thursday);
      wednesday.setDate(thursday.getDate() + 6);
      
      return { start: toDateStr(thursday), end: toDateStr(wednesday) };
    }

    function formatDetailedUnit(n, unitName) {
      const num = Number(n) || 0;
      if (num === 0 || Object.is(num, -0)) return "0" + unitName;

      const isNeg = num < 0;
      const absNum = Math.abs(num);

      const jo = Math.floor(absNum / 1000000000000);
      const eok = Math.floor((absNum % 1000000000000) / 100000000);
      const man = Math.floor((absNum % 100000000) / 10000);
      const il = absNum % 10000;

      let res = [];
      if (jo > 0) res.push(`${jo.toLocaleString()}조`);
      if (eok > 0) res.push(`${eok.toLocaleString()}억`);
      if (man > 0) res.push(`${man.toLocaleString()}만`);
      if (il > 0 || res.length === 0) res.push(`${il.toLocaleString()}`);

      return (isNeg ? "-" : "") + res.join(" ") + " " + unitName;
    }

    function fmtAmount(n) { 
      const val = Number(n) || 0;
      if (val === 0 || Object.is(val, -0)) return "0";
      return val.toLocaleString("ko-KR"); 
    }
    
    function fmtMeso(n) {
      const val = Number(n) || 0;
      if (val === 0 || Object.is(val, -0)) return "0메소";
      return formatDetailedUnit(val, "메소");
    }

    function formatKoreanCurrency(numStr, currency) {
      const n = parseInt(numStr.replace(/,/g, ""), 10);
      if (isNaN(n) || n === 0) return "";
      const unit = currency === "cash" ? "원" : currency === "meso" ? "메소" : "개";
      return formatDetailedUnit(n, unit);
    }

    function StatCard({ icon, label, value, unit, tone, isMeso, mesoSettlement }) {
      const cleanVal = (Number(value) || 0) === 0 ? 0 : value;
      const [mesoValueInput, setMesoValueInput] = useState("");

      const mesoEokDisplay = useMemo(() => {
        if (!mesoSettlement) return "";
        const val = Number(cleanVal) || 0;
        // 메소정산 금액은 1억 단위만 계산 (억 미만은 버림)
        // 예: 310억 5670만 메소 → 310억만 계산
        return Math.floor(val / 100000000);
      }, [cleanVal, mesoSettlement]);

      const mesoPriceResult = useMemo(() => {
        if (!mesoSettlement) return null;
        const rate = Number(mesoValueInput.replace(/,/g, ""));
        if (!rate || isNaN(rate)) return null;
        // 메소 정산액(억 단위) × 메소값(1억당 원)
        return mesoEokDisplay * rate;
      }, [mesoValueInput, mesoEokDisplay, mesoSettlement]);

      return (
        <div className={`ml-stat-card ${tone}`}>
          <div className="ml-stat-icon">{icon}</div>
          <div className="ml-stat-label">{label}</div>
          <div className="ml-stat-value" style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: "4px" }}>
            <span>{formatDetailedUnit(cleanVal, unit)}</span>
            {mesoSettlement && (
              <div style={{ display: "flex", alignItems: "center", gap: "4px", fontSize: "12px", fontFamily: "'Inter', sans-serif" }}>
                <input 
                  type="text"
                  inputMode="numeric"
                  placeholder="메소값"
                  value={mesoValueInput ? Number(mesoValueInput).toLocaleString("ko-KR") : ""}
                  onChange={e => {

                    if (/^\d*$/.test(v)) setMesoValueInput(v);
                  }}

                />
                <span style={{ fontSize: "11px", color: "var(--ink-soft)" }}>
                  {mesoPriceResult !== null ? `= ${formatDetailedUnit(mesoPriceResult, "원")}` : ""}

              </div>
            )}

        </div>
      );

          setGrindCalc({ startMeso: "", startPiece: "", endMeso: "", endPiece: "" });
        }
      }, [selectedChar, grindSnapshotPerChar]);

      const currentWeekRange = useMemo(() => {
        return getThursdayToWednesdayRange(bossDate);
      }, [bossDate]);

      const alreadyRecordedBossesThisWeek = useMemo(() => {
        const recorded = new Set();
        transactions.forEach(t => {
          if (t.category === "보스" && t.date >= currentWeekRange.start && t.date <= currentWeekRange.end) {
            if (t.memo && t.memo.startsWith(`[${selectedChar}]`)) {
              const match = t.memo.match(/\]\s+([^\s(]+)\s+\(([^)]+)\)/);
              if (match) {
                recorded.add(`${match[1]}_${match[2]}`);
              }
            }
          }
        });
        return recorded;
      }, [transactions, selectedChar, currentWeekRange]);

      // 이번 주에 이미 장부에 기록된 일반 보스 수 (검은마법사는 주간 12개 제한에서 제외)
      const weeklyBossCount = useMemo(() => {
        let count = 0;
        transactions.forEach(t => {
          if (t.category === "보스" && t.date >= currentWeekRange.start && t.date <= currentWeekRange.end) {
            if (t.memo && t.memo.startsWith(`[${selectedChar}]`)) {
              const match = t.memo.match(/\]\s+([^\s(]+)\s+\(([^)]+)\)/);
              if (match && match[1] !== "검은마법사") count++;
            }
          }
        });
        return count;
      }, [transactions, selectedChar, currentWeekRange]);

      const monthlyBossRange = useMemo(() => ({
        start: firstDayOfThisMonth(),
        end: lastDayOfThisMonth()
      }), [bossDate]);

      const isBlackMageAlreadyRecordedThisMonth = useMemo(() => {
        return transactions.some(t => {
          if (t.category !== "보스" || !t.memo || !t.memo.startsWith(`[${selectedChar}]`)) return false;
          if (t.date < monthlyBossRange.start || t.date > monthlyBossRange.end) return false;
          const match = t.memo.match(/\]\s+([^\s(]+)\s+\(([^)]+)\)/);
          return match && match[1] === "검은마법사";
        });
      }, [transactions, selectedChar, monthlyBossRange]);

      const isBossAlreadyRecordedThisWeek = (bossName) => {
        // 해당 보스가 이번 주에 어떤 난이도로든 기록되어 있으면
        // 같은 보스의 다른 난이도도 선택할 수 없도록 한다.
        return Array.from(alreadyRecordedBossesThisWeek).some(key => key.startsWith(`${bossName}_`));
      };

      const handleBossCheck = (bossName, diffKey) => {
        const id = `${bossName}_${diffKey}`;
        const diffLabelMap = { normal: "NORMAL", hard: "HARD", extreme: "EXTREME", chaos: "CHAOS", easy: "EASY" };
        const dLabel = diffLabelMap[diffKey] || diffKey.toUpperCase();
        
        const cfg = BOSS_CONFIGS.find(b => b.name === bossName);
        if (!cfg) return;

        if (alreadyRecordedBossesThisWeek.has(`${bossName}_${dLabel}`) || isBossAlreadyRecordedThisWeek(bossName)) {
          return;
        }
        if (cfg.isBlackMage && isBlackMageAlreadyRecordedThisMonth) return;

        // 이미 기록된 일반 보스 + 현재 선택된 일반 보스가 12개를 넘지 않도록 제한
        if (!cfg.isBlackMage) {
          const selectedOrdinaryCount = Object.values(currentSelections).filter(item => {
            const itemCfg = BOSS_CONFIGS.find(b => b.name === item.bossName);
            return itemCfg && !itemCfg.isBlackMage;
          }).length;
          if (!currentSelections[id] && weeklyBossCount + selectedOrdinaryCount >= 12) {
            alert("보스 기록 횟수가 초과되었습니다.");
            return;
          }
        }

        if (!cfg) return;

        setBossSelectionsPerChar(prev => {
          const charSel = { ...(prev[selectedChar] || {}) };
          const existingKeyForBoss = Object.keys(charSel).find(k => k.startsWith(`${bossName}_`));

          if (charSel[id]) {
            delete charSel[id];
          } else {
            if (existingKeyForBoss) {
              delete charSel[existingKeyForBoss];
            }
            charSel[id] = { bossName, diffKey, party: 1 };
          }
          const nextState = { ...prev, [selectedChar]: charSel };
          try { localStorage.setItem(STORAGE_KEYS.BOSS_STATE, JSON.stringify(nextState)); } catch(e) {}
          return nextState;
        });
      };

      const handleClearAllSelections = () => {
        setBossSelectionsPerChar(prev => {
          const nextState = { ...prev, [selectedChar]: {} };
          try { localStorage.setItem(STORAGE_KEYS.BOSS_STATE, JSON.stringify(nextState)); } catch(e) {}
          return nextState;
        });
      };

      const handleBossPartyChange = (bossName, diffKey, partyNum) => {
        const id = `${bossName}_${diffKey}`;
        setBossSelectionsPerChar(prev => {
          const charSel = { ...(prev[selectedChar] || {}) };
          if (!charSel[id]) return prev;
          charSel[id] = { ...charSel[id], party: Number(partyNum) };
          const nextState = { ...prev, [selectedChar]: charSel };
          try { localStorage.setItem(STORAGE_KEYS.BOSS_STATE, JSON.stringify(nextState)); } catch(e) {}
          return nextState;
        });
      };

      const calculatedBossTotal = useMemo(() => {
        let total = 0;
        Object.values(currentSelections).forEach(item => {
          const cfg = BOSS_CONFIGS.find(b => b.name === item.bossName);
          if (cfg) {
            const diff = cfg.diffs.find(d => d.key === item.diffKey);
            if (diff) {
              total += Math.floor(getBossPrice(cfg, diff, bossDate, currentTime) / item.party);
            }
          }
        });
        return total;
      }, [currentSelections, bossDate, currentTime]);

      const getLastBossData = () => lastBossDataPerChar[selectedChar] || [];

      // 마지막 등록 기록에서 보스만 불러오기
      const loadLastBosses = () => {
        const lastData = getLastBossData();
        if (!lastData.length) return;

        setBossSelectionsPerChar(prev => {
          const charSel = {};
          lastData.forEach(item => {
            const cfg = BOSS_CONFIGS.find(b => b.name === item.bossName);
            if (!cfg) return;
            const diff = cfg.diffs.find(d => d.key === item.diffKey);
            if (!diff) return;
            if (isBossAlreadyRecordedThisWeek(item.bossName)) return;
            if (cfg.isBlackMage && isBlackMageAlreadyRecordedThisMonth) return;
            if (!cfg.isBlackMage && weeklyBossCount >= 12) return;

            const id = `${item.bossName}_${item.diffKey}`;
            charSel[id] = { bossName: item.bossName, diffKey: item.diffKey, party: 1 };
          });
          const nextState = { ...prev, [selectedChar]: charSel };
          try { localStorage.setItem(STORAGE_KEYS.BOSS_STATE, JSON.stringify(nextState)); } catch(e) {}
          return nextState;
        });
      };

      // 현재 선택된 보스에 한해 마지막 등록 때 사용한 인원수만 불러오기
      const loadLastPartyCounts = () => {
        const lastData = getLastBossData();
        if (!lastData.length || !Object.keys(currentSelections).length) return;

        setBossSelectionsPerChar(prev => {
          const charSel = { ...(prev[selectedChar] || {}) };
          Object.keys(charSel).forEach(id => {
            const item = charSel[id];
            const saved = lastData.find(x => x.bossName === item.bossName && x.diffKey === item.diffKey);
            if (saved) {
              charSel[id] = { ...item, party: Number(saved.party) || 1 };
            }
          });
          const nextState = { ...prev, [selectedChar]: charSel };
          try { localStorage.setItem(STORAGE_KEYS.BOSS_STATE, JSON.stringify(nextState)); } catch(e) {}
          return nextState;
        });
      };

      // 마지막 등록 보스와 인원수를 한 번에 불러오기
      const loadLastBossesAndParties = () => {
        const lastData = getLastBossData();
        if (!lastData.length) return;

        setBossSelectionsPerChar(prev => {
          const charSel = {};
          lastData.forEach(item => {
            const cfg = BOSS_CONFIGS.find(b => b.name === item.bossName);
            if (!cfg) return;
            const diff = cfg.diffs.find(d => d.key === item.diffKey);
            if (!diff) return;
            if (isBossAlreadyRecordedThisWeek(item.bossName)) return;
            if (cfg.isBlackMage && isBlackMageAlreadyRecordedThisMonth) return;
            if (!cfg.isBlackMage && weeklyBossCount >= 12) return;

            const id = `${item.bossName}_${item.diffKey}`;
            charSel[id] = {
              bossName: item.bossName,
              diffKey: item.diffKey,
              party: Number(item.party) || 1
            };
          });
          const nextState = { ...prev, [selectedChar]: charSel };
          try { localStorage.setItem(STORAGE_KEYS.BOSS_STATE, JSON.stringify(nextState)); } catch(e) {}
          return nextState;
        });
      };

      const registerBossTransactions = () => {
        if (Object.keys(currentSelections).length === 0) return;
        const newTxs = [];
        const nowTime = Date.now();
        let weeklyNewCount = weeklyBossCount;
        let blackMageWillBeRecorded = isBlackMageAlreadyRecordedThisMonth;

        const selectedItems = Object.values(currentSelections);
        const selectedOrdinaryCount = selectedItems.filter(item => {
          const cfg = BOSS_CONFIGS.find(b => b.name === item.bossName);
          return cfg && !cfg.isBlackMage;
        }).length;
        if (weeklyBossCount + selectedOrdinaryCount > 12) {
          alert("보스 기록 횟수가 초과되었습니다.");
          const allowedOrdinary = Math.max(0, 12 - weeklyBossCount);
          let ordinaryKept = 0;
          const trimmedSelections = {};
          selectedItems.forEach(item => {
            const cfg = BOSS_CONFIGS.find(b => b.name === item.bossName);
            if (!cfg) return;
            if (cfg.isBlackMage || ordinaryKept < allowedOrdinary) {
              trimmedSelections[`${item.bossName}_${item.diffKey}`] = item;
              if (!cfg.isBlackMage) ordinaryKept++;
            }
          });
          setBossSelectionsPerChar(prev => {
            const nextState = { ...prev, [selectedChar]: trimmedSelections };
            try { localStorage.setItem(STORAGE_KEYS.BOSS_STATE, JSON.stringify(nextState)); } catch(e) {}
            return nextState;
          });
          return;
        }

        const validSelections = selectedItems.filter(item => {
          const cfg = BOSS_CONFIGS.find(b => b.name === item.bossName);
          if (!cfg) return false;
          const diff = cfg.diffs.find(d => d.key === item.diffKey);
          if (!diff) return false;
          if (alreadyRecordedBossesThisWeek.has(`${item.bossName}_${diff.label}`)) return false;
          if (cfg.isBlackMage) {
            if (blackMageWillBeRecorded) return false;
            blackMageWillBeRecorded = true;
            return true;
          }
          if (weeklyNewCount >= 12) return false;
          weeklyNewCount++;
          return true;
        });

        if (validSelections.length === 0) return;

        validSelections.forEach((item, index) => {
          const cfg = BOSS_CONFIGS.find(b => b.name === item.bossName);
          if (!cfg) return;
          const diff = cfg.diffs.find(d => d.key === item.diffKey);
          if (!diff) return;

          const finalPrice = Math.floor(getBossPrice(cfg, diff, bossDate, nowTime) / item.party);
          const memoStr = `[${selectedChar}] ${item.bossName} (${diff.label})${item.party > 1 ? ` / ${item.party}인 파티` : ""}`;

          newTxs.push({
            id: `${nowTime}-${index}-${Math.random().toString(36).slice(2, 7)}`,
            date: bossDate,
            currency: "meso",
            type: "income",
            category: "보스",
            amount: finalPrice,
            memo: memoStr
          });
        });

        // 마지막으로 실제 장부에 등록한 보스/난이도/인원수를 캐릭터별로 저장
        const lastRegistered = validSelections.map(item => ({
          bossName: item.bossName,
          diffKey: item.diffKey,
          party: Number(item.party) || 1
        }));
        setLastBossDataPerChar(prev => {
          const nextState = { ...prev, [selectedChar]: lastRegistered };
          try { localStorage.setItem(STORAGE_KEYS.LAST_BOSS_DATA, JSON.stringify(nextState)); } catch(e) {}
          return nextState;
        });

        setBossSelectionsPerChar(prev => {
          const nextState = { ...prev, [selectedChar]: {} };
          try { localStorage.setItem(STORAGE_KEYS.BOSS_STATE, JSON.stringify(nextState)); } catch(e) {}
          return nextState;
        });

        persistTransactions([...newTxs, ...transactions]);
        
        setShowToast(true);
        setTimeout(() => {
          setShowToast(false);
        }, 1500);
      };

      const [stdCalc, setStdCalc] = useState({ display: "0", expression: "", waitingForOperand: false, pendingOp: null, prevVal: null });

      const handleStdNum = (numStr) => {
        setStdCalc(prev => {
          if (prev.waitingForOperand) {
            return {
              ...prev,
              display: numStr,
              expression: prev.expression + " " + numStr,
              waitingForOperand: false
            };
          } else {
            const newDisplay = prev.display === "0" ? numStr : prev.display + numStr;
            let newExpr = prev.expression;
            if (newExpr === "" || newExpr === "0") {
              newExpr = numStr;
            } else {
              const parts = newExpr.split(" ");
              parts[parts.length - 1] = newDisplay;
              newExpr = parts.join(" ");
            }
            return { ...prev, display: newDisplay, expression: newExpr };
          }
        });
      };

      const handleStdOp = (op) => {
        setStdCalc(prev => {
          const currentVal = parseFloat(prev.display.replace(/,/g, "")) || 0;
          if (prev.pendingOp && !prev.waitingForOperand) {
            const result = calculateStd(prev.prevVal, currentVal, prev.pendingOp);
            return {
              display: String(result),
              expression: prev.expression + " " + op,
              prevVal: result,
              pendingOp: op,
              waitingForOperand: true
            };
          }
          const baseExpr = prev.expression === "" ? prev.display : prev.expression;
          return {
            ...prev,
            prevVal: currentVal,
            pendingOp: op,
            expression: baseExpr + " " + op,
            waitingForOperand: true
          };
        });
      };

      const calculateStd = (a, b, op) => {
        if (op === "+") return a + b;
        if (op === "-") return a - b;
        if (op === "×") return a * b;
        if (op === "÷") return b === 0 ? 0 : a / b;
        return b;
      };

      const handleStdEquals = () => {
        setStdCalc(prev => {
          if (!prev.pendingOp || prev.prevVal === null) return prev;
          const currentVal = parseFloat(prev.display.replace(/,/g, "")) || 0;
          const result = calculateStd(prev.prevVal, currentVal, prev.pendingOp);
          return {
            display: String(result),
            expression: prev.expression + " = " + result,
            waitingForOperand: true,
            pendingOp: null,
            prevVal: null
          };
        });
      };

      const handleStdClear = () => {
        setStdCalc({ display: "0", expression: "", waitingForOperand: false, pendingOp: null, prevVal: null });
      };

      const handleStdDelete = () => {
        setStdCalc(prev => {
          if (prev.waitingForOperand) return prev;
          let newDisplay = prev.display.length > 1 ? prev.display.slice(0, -1) : "0";
          let newExpr = prev.expression;
          if (newExpr !== "") {
            const parts = newExpr.split(" ");
            if (parts.length > 0) {
              parts[parts.length - 1] = newDisplay;
              newExpr = parts.join(" ").trim();
            }
          }
          return { ...prev, display: newDisplay, expression: newExpr };
        });
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (!showCalc) return;
          if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;

          if ((e.key >= "0" && e.key <= "9") || e.key === ".") {
            handleStdNum(e.key);
          } else if (e.key === "+") {
            handleStdOp("+");
          } else if (e.key === "-") {
            handleStdOp("-");
          } else if (e.key === "*" || e.key === "x") {
            handleStdOp("×");
          } else if (e.key === "/") {
            e.preventDefault();
            handleStdOp("÷");
          } else if (e.key === "Enter" || e.key === "=") {
            handleStdEquals();
          } else if (e.key === "Backspace" || e.key === "Delete") {
            e.preventDefault();
            handleStdDelete();
          } else if (e.key === "Escape" || e.key === "c" || e.key === "C") {
            handleStdClear();
          }
        };

        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [showCalc]);

      useEffect(() => {
        try {
          const txData = localStorage.getItem(STORAGE_KEYS.TX);
          if (txData) setTransactions(JSON.parse(txData));
        } catch (e) { console.error(e); }
      }, []);

      const persistTransactions = useCallback((next) => {
        setTransactions(next);
        try { localStorage.setItem(STORAGE_KEYS.TX, JSON.stringify(next)); } catch (e) {}
      }, []);

      const addTransaction = useCallback(() => {
        const rawAmt = Number(form.amount);
        if (!rawAmt || rawAmt <= 0) return;

        let finalAmt = rawAmt;
        if (isFeeApplicableCategory && effectiveFeeRate > 0) {
          finalAmt = Math.round(rawAmt * (1 - effectiveFeeRate / 100));
        }

        const tx = {
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          date: form.date, currency: form.currency, type: form.type,
          category: form.category.trim() || "기타", amount: finalAmt, memo: form.memo.trim(),
        };
        persistTransactions([tx, ...transactions]);
        
        setForm(f => ({ ...f, amount: "", memo: "", category: "", feeRate: 0 }));
        setCalc({ mesoEok: "", rate: "" });
        setPieceCalc({ count: "", rate: "" });
        setDopingCounts({ seiram: "", aleria: "", collector: "", honor: "" });
      }, [form, transactions, persistTransactions, isFeeApplicableCategory, effectiveFeeRate]);

      const registerCalcTransaction = useCallback(() => {
        const mesoEokNum = Number(calc.mesoEok.replace(/,/g, "")) || 0;
        const rateNum = Number(calc.rate.replace(/,/g, "")) || 0;
        if (mesoEokNum <= 0 || rateNum <= 0) return;

        const nowTime = Date.now();
        const memoStr = form.memo.trim();
        const rawMesoAmount = mesoEokNum * 100000000;
        const totalCashAmount = mesoEokNum * rateNum;

        if (form.currency === "cash" && form.type === "expense" && form.category === "메소구매") {
          let finalMesoAmount = rawMesoAmount;
          if (effectiveFeeRate > 0) {
            finalMesoAmount = Math.round(rawMesoAmount * (1 - effectiveFeeRate / 100));
          }

          const cashTx = {
            id: `${nowTime}-cash-${Math.random().toString(36).slice(2, 7)}`,
            date: form.date, currency: "cash", type: "expense",
            category: "메소구매", amount: totalCashAmount, memo: memoStr
          };
          const mesoTx = {
            id: `${nowTime}-meso-${Math.random().toString(36).slice(2, 7)}`,
            date: form.date, currency: "meso", type: "income",
            category: "메소구매", amount: finalMesoAmount, memo: memoStr
          };
          persistTransactions([cashTx, mesoTx, ...transactions]);
        } else if (form.currency === "cash" && form.type === "income" && form.category === "메소판매") {
          const cashTx = {
            id: `${nowTime}-cash-${Math.random().toString(36).slice(2, 7)}`,
            date: form.date, currency: "cash", type: "income",
            category: "메소판매", amount: totalCashAmount, memo: memoStr
          };
          const mesoTx = {
            id: `${nowTime}-meso-${Math.random().toString(36).slice(2, 7)}`,
            date: form.date, currency: "meso", type: "expense",
            category: "메소판매", amount: rawMesoAmount, memo: memoStr
          };
          persistTransactions([cashTx, mesoTx, ...transactions]);
        }

        setForm(f => ({ ...f, memo: "", feeRate: 0 }));
        setCalc({ mesoEok: "", rate: "" });
      }, [form, calc, transactions, persistTransactions, effectiveFeeRate]);

      const deleteTransaction = useCallback((id) => {
        persistTransactions(transactions.filter((t) => t.id !== id));
      }, [transactions, persistTransactions]);

      const [range, setRange] = useState({ start: firstDayOfThisMonth(), end: lastDayOfThisMonth() });
      const rangeTx = useMemo(() => transactions.filter(t => t.date >= range.start && t.date <= range.end), [transactions, range]);
      const sumFor = (list, currency, type) => list.filter(t => t.currency === currency && t.type === type).reduce((s, t) => s + t.amount, 0);

      const summary = {
        cashIncome: sumFor(rangeTx, "cash", "income"),
        cashExpense: sumFor(rangeTx, "cash", "expense"),
        mesoIncome: sumFor(rangeTx, "meso", "income"),
        mesoExpense: sumFor(rangeTx, "meso", "expense"),
        pieceIncome: sumFor(rangeTx, "piece", "income"),
        pieceExpense: sumFor(rangeTx, "piece", "expense"),
      };

      const totalCashNet = sumFor(transactions, "cash", "income") - sumFor(transactions, "cash", "expense");
      const totalMesoNet = sumFor(transactions, "meso", "income") - sumFor(transactions, "meso", "expense");
      const totalPieceNet = sumFor(transactions, "piece", "income") - sumFor(transactions, "piece", "expense");

      const cashTargetNum = Number(goals.cash) || 0;
      const cashGoalPercent = cashTargetNum > 0 ? Math.min(100, Math.max(0, Math.round((totalCashNet / cashTargetNum) * 100))) : 0;

      const mesoTargetNum = Number(goals.meso) || 0;
      const mesoGoalPercent = mesoTargetNum > 0 ? Math.min(100, Math.max(0, Math.round((totalMesoNet / mesoTargetNum) * 100))) : 0;

      const pieceTargetNum = Number(goals.piece) || 0;
      const pieceGoalPercent = pieceTargetNum > 0 ? Math.min(100, Math.max(0, Math.round((totalPieceNet / pieceTargetNum) * 100))) : 0;

      const isThisMonth = range.start === firstDayOfThisMonth() && range.end === lastDayOfThisMonth();
      
      const [historyRange, setHistoryRange] = useState({ start: firstDayOfThisMonth(), end: lastDayOfThisMonth() });
      const isHistoryThisMonth = historyRange.start === firstDayOfThisMonth() && historyRange.end === lastDayOfThisMonth();

      const [historyFilter, setHistoryFilter] = useState({ currency: "all", type: "all" });
      const [historyView, setHistoryView] = useState("list");

      const filteredHistory = useMemo(() => transactions.filter(t => 
        t.date >= historyRange.start && t.date <= historyRange.end &&
        (historyFilter.currency === "all" || t.currency === historyFilter.currency) && 
        (historyFilter.type === "all" || t.type === historyFilter.type)
      ), [transactions, historyRange, historyFilter]);

      const currencyRootGroupedHistory = useMemo(() => {
        const rootMap = {
          cash: { name: "현금 (KRW)", currency: "cash", net: 0, categoryMap: {} },
          meso: { name: "메소", currency: "meso", net: 0, categoryMap: {} },
          piece: { name: "조각 (Pieces)", currency: "piece", net: 0, categoryMap: {} }
        };

        filteredHistory.forEach(t => {
          const root = rootMap[t.currency];
          if (!root) return;

          const netVal = t.type === "income" ? t.amount : -t.amount;
          root.net += netVal;

          if (!root.categoryMap[t.category]) {
            root.categoryMap[t.category] = { category: t.category, currency: t.currency, net: 0, charMap: {} };
          }
          root.categoryMap[t.category].net += netVal;

          let charName = "기타/미분류";
          if (t.memo && t.memo.startsWith("[")) {
            const bracketEnd = t.memo.indexOf("]");
            if (bracketEnd > 1) {
              charName = t.memo.slice(1, bracketEnd);
            }
          }

          if (!root.categoryMap[t.category].charMap[charName]) {
            root.categoryMap[t.category].charMap[charName] = { charName, net: 0, items: [] };
          }
          root.categoryMap[t.category].charMap[charName].net += netVal;
          root.categoryMap[t.category].charMap[charName].items.push(t);
        });

        return Object.values(rootMap).map(root => {
          const categories = Object.values(root.categoryMap).map(cat => {
            const charGroups = Object.values(cat.charMap).sort((a, b) => {
              if (a.charName === "기타/미분류") return 1;
              if (b.charName === "기타/미분류") return -1;
              return a.charName.localeCompare(b.charName);
            });
            return { ...cat, charGroups };
          }).sort((a, b) => {
            if (a.category.length !== b.category.length) {
              return a.category.length - b.category.length;
            }
            return a.category.localeCompare(b.category);
          });
          return { ...root, categories };
        });
      }, [filteredHistory]);

        const list = CATEGORY_SUGGESTIONS[form.currency][form.type] || [];
        return [...list].sort((a, b) => {

            return a.length - b.length;

          return a.localeCompare(b);
        });

      const rawCalcRate = Number(calc.rate.replace(/,/g, "")) || 0;
      const calcResult = (rawCalcMeso > 0 && rawCalcRate > 0) ? Math.round(rawCalcMeso * rawCalcRate) : null;
      
      const rawPieceCount = Number(pieceCalc.count.replace(/,/g, "")) || 0;
      const rawPieceRate = Number(pieceCalc.rate.replace(/,/g, "")) || 0;

        if (!isDopingCategory) return 0;

        const c = (Number(dopingCounts.collector) || 0) * 20000000;
        const h = (Number(dopingCounts.honor) || 0) * 5000000;
        return s + a + c + h;
      }, [isDopingCategory, dopingCounts]);

        if (!isDopingCategory) return "";
        const parts = [];
        if (Number(dopingCounts.seiram) > 0) parts.push(`세람${dopingCounts.seiram}`);
        if (Number(dopingCounts.aleria) > 0) parts.push(`알레리아${dopingCounts.aleria}`);
        if (Number(dopingCounts.collector) > 0) parts.push(`콜렉터${dopingCounts.collector}`);
        if (Number(dopingCounts.honor) > 0) parts.push(`명예영약${dopingCounts.honor}`);
        return parts.join(", ");
      }, [isDopingCategory, dopingCounts]);

      const salePrice = Number(splitInput.salePrice.replace(/,/g, "")) || 0;
      const memberCount = Number(splitInput.partyCount) || 1;
      const feeRate = (Number(splitInput.feePercent) || 0) / 100;

      const splitResult = useMemo(() => {
        if (salePrice <= 0 || memberCount <= 0) return { actual: 0, memberFinal: 0, leaderFinal: 0, memberBeforeFee: 0 };

        const actual = salePrice * (1 - feeRate);
        const equalShare = actual / (1 + (memberCount - 1) / (1 - feeRate));
        
        const rawMemberBeforeFee = equalShare / (1 - feeRate);
        const memberBeforeFee = Math.floor(rawMemberBeforeFee / 100) * 100;

        const memberFinal = memberBeforeFee * (1 - feeRate);
        const partyMembersCount = memberCount - 1;
        const leaderFinal = actual - (memberBeforeFee * partyMembersCount);

        return { 
          actual, 
          memberFinal, 
          leaderFinal,
          memberBeforeFee
        };
      }, [salePrice, memberCount, feeRate]);

                                      const isCgCollapsed = !!collapsedCharGroups[cgKey];
                                      return (
                                        <div key={cgKey}>
                                          <div className="ml-chargroup-header" onClick={() => toggleCharGroup(cgKey)}>
                                            <span className="ml-chargroup-name">
                                              <span>{isCgCollapsed ? "▸" : "▾"}</span>
                                              🧙 {cg.charName}
                                            </span>
                                            <span className={`ml-chargroup-total ${cg.net >= 0 ? "income" : "expense"}`}>
                                              {cg.net >= 0 ? "+" : "−"}{fmtAmount(Math.abs(cg.net))}
                                              {rootUnitLabel}
                                            </span>
                                          </div>
                                          {!isCgCollapsed && cg.items.map(t => <TxRow key={t.id} t={t} onDelete={() => deleteTransaction(t.id)} compact />)}
                                        </div>
                                      );
                                    })}
                                  </div>
                                );
                              })
                            )
                          )}
                        </div>
                      );
                    })}
                  </div>
                </section>
              )}
            </main>
          </div>

          {showToast && (
            <div className="ml-toast">
              클립보드에 복사되었습니다!
            </div>
          )}

          <div className="ml-floating-goal-container">
            {(cashTargetNum > 0 || mesoTargetNum > 0 || pieceTargetNum > 0) && (
              <div className="ml-mini-goal-widget">
                <div style={{ fontSize: "11px", fontWeight: "700", color: "var(--ink-soft)", marginBottom: "2px" }}>🎯 정산 목표 달성률</div>
                
                {cashTargetNum > 0 && (
                  <div className="ml-mini-goal-item">
                    <div className="ml-mini-goal-top">
                      <span>현금 정산 ({cashGoalPercent}%)</span>
                      <span>{formatDetailedUnit(totalCashNet, "원")} / {formatDetailedUnit(cashTargetNum, "원")}</span>
                    </div>
                    <div className="ml-mini-bar-bg">
                      <div className="ml-mini-bar-fill" style={{ width: `${cashGoalPercent}%` }}></div>
                    </div>
                  </div>
                )}

                {mesoTargetNum > 0 && (
                  <div className="ml-mini-goal-item">
                    <div className="ml-mini-goal-top">
                      <span>메소 정산 ({mesoGoalPercent}%)</span>
                      <span>{formatDetailedUnit(totalMesoNet, "메소")} / {formatDetailedUnit(mesoTargetNum, "메소")}</span>
                    </div>
                    <div className="ml-mini-bar-bg">
                      <div className="ml-mini-bar-fill" style={{ width: `${mesoGoalPercent}%`, background: "var(--gold)" }}></div>
                    </div>
                  </div>
                )}

                {pieceTargetNum > 0 && (
                  <div className="ml-mini-goal-item">
                    <div className="ml-mini-goal-top">
                      <span>조각 정산 ({pieceGoalPercent}%)</span>
                      <span>{formatDetailedUnit(totalPieceNet, "개")} / {formatDetailedUnit(pieceTargetNum, "개")}</span>
                    </div>
                    <div className="ml-mini-bar-bg">
                      <div className="ml-mini-bar-fill" style={{ width: `${pieceGoalPercent}%`, background: "#3A76A8" }}></div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {showGoalBox && (
              <div className="ml-goal-floating-box">
                <div className="ml-calc-title">
                  <span>🎯 정산 목표 금액 설정</span>
                  <button style={{ background: "none", border: "none", cursor: "pointer", fontWeight: 700 }} onClick={() => setShowGoalBox(false)}>✖</button>
                </div>
                
                <div className="ml-form-row" style={{ marginBottom: "6px" }}>
                  <label>💳 현금 목표 (원)</label>
                  <input 
                    type="text" 
                    placeholder="0" 
                    value={goals.cash ? Number(goals.cash).toLocaleString("ko-KR") : ""} 
                    onChange={e => {
                      const val = e.target.value.replace(/,/g, "");
                      if (/^\d*$/.test(val)) saveGoals({ ...goals, cash: val });
                    }} 
                  />
                </div>

                <div className="ml-form-row" style={{ marginBottom: "6px" }}>
                  <label>💰 메소 목표 (메소)</label>
                  <input 
                    type="text" 
                    placeholder="0" 
                    value={goals.meso ? Number(goals.meso).toLocaleString("ko-KR") : ""} 
                    onChange={e => {
                      const val = e.target.value.replace(/,/g, "");
                      if (/^\d*$/.test(val)) saveGoals({ ...goals, meso: val });
                    }} 
                  />
                </div>

                <div className="ml-form-row" style={{ marginBottom: "0" }}>
                  <label>🧩 조각 목표 (개)</label>
                  <input 
                    type="text" 
                    placeholder="0" 
                    value={goals.piece ? Number(goals.piece).toLocaleString("ko-KR") : ""} 
                    onChange={e => {
                      const val = e.target.value.replace(/,/g, "");
                      if (/^\d*$/.test(val)) saveGoals({ ...goals, piece: val });
                    }} 
                  />
                </div>
              </div>
            )}

            <button className="ml-goal-toggle-btn" onClick={() => setShowGoalBox(!showGoalBox)}>
              <span>🎯</span> {showGoalBox ? "목표 설정 닫기" : "목표 설정 열기"}
            </button>
          </div>

          <div className="ml-sidebar-calc-container">
            {showSplitCalc && (
              <div className="ml-sidebar-calc">
                <div className="ml-calc-title">
                  <span>💰 분배금 계산기 (공평 분배)</span>
                </div>
                
                <div className="ml-form-row" style={{ marginBottom: "6px" }}>
                  <label>경매장 판매액</label>
                  <input 
                    type="text" 
                    placeholder="0" 
                    value={splitInput.salePrice ? Number(splitInput.salePrice).toLocaleString("ko-KR") : ""} 
                    onChange={e => {
                      const val = e.target.value.replace(/,/g, "");
                      if (/^\d*$/.test(val)) setSplitInput(s => ({ ...s, salePrice: val }));
                    }} 
                  />
                  {splitInput.salePrice && (
                    <div className="ml-korean-amount" style={{ fontSize: "11px", textAlign: "right" }}>
                      {formatDetailedUnit(splitInput.salePrice, "메소")}
                    </div>
                  )}
                </div>

                <div style={{ display: "flex", gap: "6px", marginBottom: "6px" }}>
                  <div className="ml-form-row" style={{ flex: 1, marginBottom: 0 }}>
                    <label>총 인원수</label>
                    <input 
                      type="number" 
                      min="1" 
                      max="18" 
                      value={splitInput.partyCount} 
                      onChange={e => setSplitInput(s => ({ ...s, partyCount: e.target.value }))} 
                    />
                  </div>
                  <div className="ml-form-row" style={{ flex: 1, marginBottom: 0 }}>
                    <label>수수료 (%)</label>
                    <input 
                      type="number" 
                      min="0" 
                      max="100" 
                      value={splitInput.feePercent} 
                      onChange={e => setSplitInput(s => ({ ...s, feePercent: e.target.value }))} 
                    />
                  </div>
                </div>

                <div id="split-result-capture-area" style={{ background: "#FBF7EC", border: "1px solid var(--line)", borderRadius: "3px", padding: "8px 10px", marginBottom: "8px", wordBreak: "break-all", overflowWrap: "break-word" }}>
                  <div style={{ fontSize: "11px", color: "var(--ink-soft)", borderBottom: "1px solid var(--line)", paddingBottom: "6px", marginBottom: "6px", display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "8px" }}>
                    <div>
                      <div style={{ fontSize: "10px", color: "var(--ink-soft)" }}>경매장 판매액:</div>
                      <strong style={{ fontSize: "12px" }}>{splitInput.salePrice ? formatDetailedUnit(splitInput.salePrice, "메소") : "0 메소"}</strong>
                    </div>
                    <div style={{ textAlign: "right", whiteSpace: "nowrap" }}>
                      <span>인원: <strong>{splitInput.partyCount}명</strong></span><br/>
                      <span>수수료: <strong>{splitInput.feePercent}%</strong></span>
                    </div>
                  </div>
                  <div style={{ fontSize: "11px", color: "var(--ink-soft)" }}>
                    실제 수령액: <strong>{formatDetailedUnit(splitResult.actual, "메소")}</strong>
                  </div>
                  <div style={{ fontSize: "11px", color: "var(--ink-soft)", marginTop: "2px" }}>
                    파티원 전달 금액: <strong style={{ color: "var(--income)" }}>{formatDetailedUnit(splitResult.memberBeforeFee, "메소")}</strong>
                  </div>
                  <div style={{ fontSize: "11px", color: "var(--ink-soft)", marginTop: "2px" }}>
                    최종 동일 분배금: <strong style={{ color: "var(--income)" }}>{formatDetailedUnit(splitResult.memberFinal, "메소")}</strong>
                  </div>
                  <div style={{ fontSize: "10px", color: "var(--ink-soft)", marginTop: "6px", borderTop: "1px dashed var(--line)", paddingTop: "4px", lineHeight: "1.4" }}>
                    💡 파티원에게 <strong>{formatDetailedUnit(splitResult.memberBeforeFee, "메소")}</strong>를 보내면, 파티원과 파티장 모두 최종적으로 정확히 <strong>{formatDetailedUnit(splitResult.memberFinal, "메소")}</strong>을 갖게 됩니다! (100원 내림 잔여분 파티장 귀속)
                  </div>
                </div>

                <button className="ml-calc-apply" style={{ width: "100%", padding: "6px", textAlign: "center" }} onClick={handleCaptureSplitResult} disabled={salePrice <= 0}>
                  📋 결과 이미지 복사하기 (Ctrl+V)
                </button>
              </div>
            )}
            <button className="ml-calc-toggle-btn" onClick={() => setShowSplitCalc(!showSplitCalc)}>
              {showSplitCalc ? "분배금 계산기 닫기 ✖" : "💰 분배금 계산기 켜기"}
            </button>

            {showCalc && (
              <div className="ml-sidebar-calc">
                <div className="ml-calc-title">
                  <span>🧮 간편 계산기</span>
                </div>
                <div className="ml-calc-screen">
                  <div className="ml-calc-expression">{stdCalc.expression}</div>
                  <div className="ml-calc-display">{Number(stdCalc.display.replace(/,/g, "") || 0).toLocaleString("ko-KR")}</div>
                </div>
                <div className="ml-calc-keypad">
                  <button className="ml-calc-btn" onClick={handleStdClear}>C</button>
                  <button className="ml-calc-btn" onClick={handleStdDelete} title="한 글자 지우기">⌫</button>
                  <button className="ml-calc-btn op" onClick={() => handleStdOp("÷")}>÷</button>
                  <button className="ml-calc-btn op" onClick={() => handleStdOp("×")}>×</button>

                  <button className="ml-calc-btn" onClick={() => handleStdNum("7")}>7</button>
                  <button className="ml-calc-btn" onClick={() => handleStdNum("8")}>8</button>
                  <button className="ml-calc-btn" onClick={() => handleStdNum("9")}>9</button>
                  <button className="ml-calc-btn op" onClick={() => handleStdOp("-")}>-</button>

                  <button className="ml-calc-btn" onClick={() => handleStdNum("4")}>4</button>
                  <button className="ml-calc-btn" onClick={() => handleStdNum("5")}>5</button>
                  <button className="ml-calc-btn" onClick={() => handleStdNum("6")}>6</button>
                  <button className="ml-calc-btn op" onClick={() => handleStdOp("+")}>+</button>

                  <button className="ml-calc-btn" onClick={() => handleStdNum("1")}>1</button>
                  <button className="ml-calc-btn" onClick={() => handleStdNum("2")}>2</button>
                  <button className="ml-calc-btn" onClick={() => handleStdNum("3")}>3</button>
                  <button className="ml-calc-btn action" style={{ gridRow: "span 2" }} onClick={handleStdEquals}>=</button>

                  <button className="ml-calc-btn" style={{ gridColumn: "span 2" }} onClick={() => handleStdNum("0")}>0</button>
                  <button className="ml-calc-btn" onClick={() => {
                    setStdCalc(prev => ({ ...prev, display: prev.display.includes(".") ? prev.display : prev.display + "." }));
                  }}>.</button>
                </div>
              </div>
            )}
            <button className="ml-calc-toggle-btn" onClick={() => setShowCalc(!showCalc)}>
              {showCalc ? "계산기 끄기 ✖" : "🧮 계산기 켜기"}
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MapleLedger />);
  </script>
</body>
</html>
